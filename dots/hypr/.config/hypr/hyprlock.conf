general {
  hide_cursor = false
  text_trim = true
}

background {
  path = ~/Pictures/walls/bg-blurred.png
  brightness = 0.8
}

animations {
  animation = fadeOut, 0
}


# accent ring behind the clock
shape {
  monitor =
  size = 220, 220
  color = rgba(0, 0, 0, 0.0)
  rounding = -1
  border_size = 3
  border_color = rgba(180, 210, 255, 0.22)

  position = 0, 330
  halign = center
  valign = center
  zindex = 1

  shadow_size = 10
  shadow_passes = 2
  shadow_color = rgba(120, 170, 255, 0.08)
}

label {
  monitor =
  text = $TIME
  color = rgba(255, 255, 255, 0.96)
  font_size = 96
  font_family = Noto Sans

  position = 0, 330
  halign = center
  valign = center
  zindex = 3

  shadow_size = 6
  shadow_passes = 2
  shadow_color = rgba(0, 0, 0, 0.25)
}

label {
  monitor =
  text = <span alpha="85%">Hi there,</span> <b>$USER</b>
  color = rgba(255, 255, 255, 0.90)
  font_size = 24
  font_family = Noto Sans

  position = 0, 245
  halign = center
  valign = center
  zindex = 3

  shadow_size = 4
  shadow_passes = 2
  shadow_color = rgba(0, 0, 0, 0.18)
}

input-field {
  monitor =
  size = 340, 56
  outline_thickness = 2
  rounding = 14

  position = 0, 32%
  halign = center
  valign = bottom
  zindex = 3

  font_color = rgba(255, 255, 255, 0.95)
  outer_color = rgba(235, 240, 255, 0.22)
  inner_color = rgba(0, 0, 0, 0.22)
  check_color = rgba(170, 220, 140, 0.95)
  fail_color = rgba(255, 120, 140, 0.95)
  capslock_color = rgba(255, 190, 90, 0.95)

  fade_on_empty = false
  placeholder_text = <i>Password...</i>

  dots_spacing = 0.22
  dots_center = true
  dots_rounding = -1

  shadow_color = rgba(0, 0, 0, 0.18)
  shadow_size = 10
  shadow_passes = 3
}

label {
  monitor =
  text = cmd[update:1000] echo "<span>$(~/.config/hypr/hyprlock-player.sh)</span>"
  color = rgba(255, 255, 255, 0.78)
  font_size = 12
  font_family = JetBrainsMono Nerd Font

  position = 0, 40
  halign = center
  valign = bottom
  text_align = center
  zindex = 3

  onclick = playerctl play-pause
}
