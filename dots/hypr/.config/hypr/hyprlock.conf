general {
  hide_cursor = false
  text_trim = true
}

# blurred wallpaper, darkened to mimic the sword theme's vignette
background {
  monitor = 
  path = ~/Pictures/walls/bg-lock.png
  brightness = 0.52
  contrast = 1.05
}

animations {
  animation = fadeOut, 0
}

# ── faint divider line near the bottom (sword's #15a0c8e0 hairline) ──
shape {
  monitor = DP-1
  size = 2600, 1
  color = rgba(160, 200, 224, 0.082)
  rounding = 0
  border_size = 0

  position = 0, 95
  halign = center
  valign = bottom
  zindex = 1
}

# ── clock: large thin time, top-left ──
label {
  monitor = DP-1
  text = <span weight="200">$TIME</span>
  color = rgba(250, 206, 185, 1.0)
  font_size = 165
  font_family = The Last Shuriken

  position = 100, -120
  halign = left
  valign = top
  zindex = 3

  shadow_size = 6
  shadow_passes = 2
  shadow_color = rgba(0, 0, 0, 0.25)
}

# ── date: accented, uppercase, letter-spaced, under the clock ──
label {
  monitor = DP-1
  text = cmd[update:1000] echo "<span letter_spacing='4300'>—   $(date '+%A · %B %-d' | tr '[:lower:]' '[:upper:]')</span>"
  color = rgba(188, 135, 115, 0.95)
  font_size = 24
  font_family = The Last Shuriken

  position = 110, -300
  halign = left
  valign = top
  zindex = 3
}

# ── username: bottom-right ──
label {
  monitor = DP-1
  text = <span letter_spacing="2800">$USER</span>
  color = rgba(250, 206, 185, 1.0)
  font_size = 41
  font_family = The Last Shuriken

  position = -55, 220
  halign = right
  valign = bottom
  zindex = 3

  shadow_size = 4
  shadow_passes = 2
  shadow_color = rgba(0, 0, 0, 0.20)
}

# ── password field: bottom-right, steel-blue accent ──
# underline beneath the password field (sword's hairline, no box)
shape {
  monitor = DP-1
  size = 300, 3
  color = rgba(188, 135, 115, 1.0)
  rounding = 0
  border_size = 0

  position = -55, 150
  halign = right
  valign = bottom
  zindex = 3
}

input-field {
  monitor = DP-1
  size = 300, 40
  outline_thickness = 0
  rounding = 0

  position = -55, 158
  halign = right
  valign = bottom
  zindex = 3

  font_color = rgba(188, 135, 115, 1.0)
  outer_color = rgba(0, 0, 0, 0.0)
  inner_color = rgba(0, 0, 0, 0.0)
  check_color = rgba(128, 176, 216, 0.0)
  fail_color = rgba(208, 96, 96, 0.0)
  capslock_color = rgba(255, 190, 90, 0.0)

  fade_on_empty = false
  placeholder_text = 
  dots_text_format = 🛡️

  dots_spacing = 0.25
  dots_center = false
  dots_rounding = -1

  shadow_size = 0
}

# ── now-playing, bottom-left (where sword shows the session) ──
label {
  monitor = DP-1
  text = cmd[update:1000] echo "<span>$(~/.config/hypr/hyprlock-player.sh)</span>"
  color = rgba(255, 255, 255, 0.70)
  font_size = 12
  font_family = JetBrainsMono Nerd Font

  position = 55, 45
  halign = left
  valign = bottom
  text_align = left
  zindex = 3

  onclick = playerctl play-pause
}
