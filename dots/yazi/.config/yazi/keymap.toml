[[mgr.prepend_keymap]]
on = [ "c", "a" ]
run = "plugin ouch"
desc = "Create archive (ouch)"

[[mgr.append_keymap]]
# Copy
on = [ "c", "k" ]
run = "shell 'cat $0 | wl-copy' --confirm"
desc = "Copy the file content"

[[mgr.prepend_keymap]]
on   = [ "g", "p" ]
run  = "cd ~/Pictures"
desc = "Go to ~/Pictures"

[[mgr.prepend_keymap]]
on   = [ "g", "d" ]
run  = "cd ~/Downloads"
desc = "Go to ~/Downloads"

[[mgr.prepend_keymap]]
on   = [ "g", "/" ]
run  = "cd /"
desc = "Go to /"

[[mgr.prepend_keymap]]
on   = [ "g", "t" ]
run  = "cd ~/git"
desc = "Go to ~/git"

[[mgr.prepend_keymap]]
on  = "<C-n>"
run  = 'shell "ripdrag $@" --orphan'
desc = "Drag hovered/selected files with ripdrag"

[[mgr.prepend_keymap]]
on   = "<C-p>"
run  = "plugin toggle-pane min-preview"
desc = "Toggle preview pane"
